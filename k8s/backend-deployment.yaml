apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitment-backend
  namespace: fitment-catalog
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fitment-backend
  template:
    metadata:
      labels:
        app: fitment-backend
    spec:
      containers:
        - name: fitment-backend
          image: ghcr.io/your-org/fitment-catalog-backend:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: fitment-backend-config
            - secretRef:
                name: fitment-backend-secret
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: fitment-backend-service
  namespace: fitment-catalog
spec:
  selector:
    app: fitment-backend
  ports:
    - port: 80
      targetPort: 4000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fitment-backend-hpa
  namespace: fitment-catalog
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fitment-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
